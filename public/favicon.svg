<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Hotline Camp</title>
  <style>
    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: neon-pulse 2.8s ease-out infinite;
    }

    @keyframes neon-pulse {
      0% {
        opacity: 0.62;
        transform: scale(0.82);
      }
      70%, 100% {
        opacity: 0;
        transform: scale(1.28);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse {
        animation: none;
        opacity: 0.24;
        transform: none;
      }
    }
  </style>
  <defs>
    <filter id="neon" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>
  </defs>
  <circle class="pulse" cx="32" cy="32" r="20" fill="none" stroke="#ff5b78" stroke-width="6" filter="url(#neon)" />
  <circle cx="32" cy="32" r="17" fill="none" stroke="#ff5b78" stroke-width="7" />
</svg>
