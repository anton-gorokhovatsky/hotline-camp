<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Hotline Camp</title>
  <style>
    .tile { fill: #f2ecdf; stroke: #789aa0; }
    .rail { fill: #131c1a; }
    .signal { fill: #86172f; }

    @media (prefers-color-scheme: dark) {
      .tile { fill: #131c1a; stroke: #0b2b1d; }
      .rail { fill: #f2ecdf; }
      .signal { fill: #df5673; }
    }
  </style>
  <rect class="tile" x="2" y="2" width="60" height="60" rx="14" stroke-width="2" />
  <g class="rail">
    <circle cx="17" cy="16" r="3.2" />
    <circle cx="17" cy="24" r="3.2" />
    <circle cx="17" cy="40" r="3.2" />
    <circle cx="17" cy="48" r="3.2" />
    <circle cx="47" cy="16" r="3.2" />
    <circle cx="47" cy="24" r="3.2" />
    <circle cx="47" cy="40" r="3.2" />
    <circle cx="47" cy="48" r="3.2" />
  </g>
  <g class="signal">
    <circle cx="17" cy="32" r="3.2" />
    <circle cx="24.5" cy="32" r="3.2" />
    <circle cx="32" cy="32" r="3.2" />
    <circle cx="39.5" cy="32" r="3.2" />
    <circle cx="47" cy="32" r="3.2" />
  </g>
</svg>
